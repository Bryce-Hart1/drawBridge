[package]
name = "drawbridge-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "drawbridge_app"

[[bin]]
name = "drawbridge"
path = "src/main.rs"

[build-dependencies]
# 11/03/2026: generates the app context (config, icons, permissions) from
# tauri.conf.json and capabilities/. Same release train as `tauri` below.
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
drawbridge-core = { path = "../../crates/core" }
# 11/03/2026: the desktop shell: one window on the system webview (WKWebView on
# macOS), commands and events between it and Rust, and the `thumb://` protocol.
tauri = { version = "2.12.4", features = [] }
# 11/03/2026: the native open and save panels. Files are then read and written
# by path in Rust; their bytes never cross into the webview.
tauri-plugin-dialog = "2.8.3"
# 11/03/2026: keeps the swiftSearch access key in the macOS Keychain rather than
# in a file next to the index.
keyring = { version = "4.2.0", features = [] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["sync", "time", "macros"] }
# 11/09/2026: moves a file or folder to the Trash (macOS: NSFileManager's
# trashItemAtURL), for "delete the originals" after an upload. Nothing here
# ever deletes for good. Its default features are for listing and restoring
# the Trash on other systems; this only sends things there.
trash = { version = "5.3.0", default-features = false }

[dev-dependencies]
tempfile = "3"
